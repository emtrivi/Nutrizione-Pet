# Pubblica una versione di Nutrizione Pet: SOLO aggiornamento via internet (EAS Update).
#
# Parte SOLO quando cambia release/versione.json sul ramo principale.
# Non cerca build, non fa build e non invia a TestFlight: un problema con Apple o una build
# scaduta sui server di Expo non può più bloccare l'aggiornamento.
#
# Sicurezza: il telefono scarica un aggiornamento solo se la sua «Runtime version» (= impronta della
# parte nativa) è uguale a quella della build installata. Prima di pubblicare, il test
# src/__tests__/impronta.test.ts controlla che l'impronta sia quella di release/impronta-ios.json.
# Se la parte nativa cambia serve una build: release/rinnovo-testflight.json (rinnovo-testflight.yml).
# Non pubblica mai sull'App Store.

name: Pubblica versione

on:
  push:
    branches: ['claude/dog-recipe-app-phase-1-fp4zxh']
    paths: ['release/versione.json']

concurrency:
  cancel_in_progress: false
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  impronta:
    # Solo informativo: l'impronta compare nel registro, da confrontare con release/impronta-ios.json.
    name: Impronta della parte nativa (da leggere)
    type: fingerprint
    environment: production

  aggiornamento:
    name: Aggiornamento via internet (EAS Update)
    type: update
    environment: production
    params:
      # Canale "production", lo stesso delle build (eas.json): l'aggiornamento va sul ramo a cui il
      # canale è collegato su Expo, quindi arriva alle app installate da TestFlight.
      channel: production
      platform: ios
